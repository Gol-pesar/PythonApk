name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable was not found on PATH."
            exit 1
          fi

          java -version

          VERSION_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VERSION="$(printf '%s' "$VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [[ -z "$RAW_VERSION" ]]; then
            echo "::error::Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d'.' -f1)"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse numeric Java major version from: $RAW_VERSION"
            exit 1
          fi

          echo "Detected active Java major version: $MAJOR_VERSION"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="./debug.keystore"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            echo "Debug keystore already exists; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [[ ! -x "$KEYTOOL_BIN" ]]; then
              echo "::error::keytool was not found in configured Java 17 installation at JAVA_HOME."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi

          if [[ ! -f "$KEYSTORE_PATH" || ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -e "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" | sort || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$EXPECTED_APK" ]]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified debug APK: $EXPECTED_APK (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" ]]; then
            echo "::error::Verified debug APK is missing or empty at $SOURCE_APK."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$SAFE_REPO_NAME" ]]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is invalid: $ASSET_PATH"
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset filename: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset validation failed; skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **APK Asset:** \`${ASSET_NAME}\`

          **Important:**
          - This APK is intended for testing only.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the workflow run.
          EOF
          )"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERIFIED="false"
          RELEASE_URL=""

          if [[ "$RELEASE_OUTCOME" == "success" && -n "${RELEASE_TAG:-}" ]]; then
            if RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && [[ -n "$RELEASE_URL" ]]; then
              RELEASE_VERIFIED="true"
            fi
          fi

          if [[ "$RELEASE_VERIFIED" == "true" ]]; then
            echo "GitHub Release published and verified successfully."
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** Build, artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct Release Page:** [Open GitHub Release](${RELEASE_URL})"
              echo ""
              echo "Download the debug APK directly from the **Assets** section of the release page above."
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available in this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or could not be verified. The debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available for download."
            echo "APK Build Status: Succeeded"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "## Debug APK Build Summary (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, but the debug APK build and Actions artifact upload succeeded."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact Backup:** \`app-debug-apk\` (available for download in this workflow run's **Artifacts** section)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
